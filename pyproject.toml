[project]
name = "kiku-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [ "kiku-ai" ]


[tool.uv.sources]
kiku-ai = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "ruff>=0.15.22",
    "ty>=0.0.63",
]

 [tool.uv]
 package = false

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
	  # flake8-quotes
    "Q",
]

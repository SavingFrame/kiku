[project]
name = "kiku-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
 "kiku-ai",
 "pydantic>=2.13.4",
]


[tool.uv.sources]
kiku-ai = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "prek>=0.4.10",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.22",
    "ty>=0.0.63",
]

 [tool.uv]
 package = false

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
	 # flake8-quotes
    "Q",
    # flake-annotations
    "ANN",
]

[tool.ruff]
# Allow lines to be as long as 120.
line-length = 120
